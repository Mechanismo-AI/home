    window.addEventListener("resize", layout); requestAnimationFrame(tick);
  }
  const builtIn = () => JSON.parse(document.getElementById("built-in").textContent);
  const NAME = /^[a-z0-9-]+\.json$/;
  const late = new Promise((_, no) => setTimeout(no, 2500));
  Promise.race([late, fetch("sets/index.json", {cache: "no-cache"}).then((r) => r.ok ? r.json() : Promise.reject())
    .then((ix) => { const names = (ix.sets || []).filter((n) => NAME.test(n));
      if (!names.length) return Promise.reject();
      return fetch("sets/" + names[Math.floor(Math.random() * names.length)]).then((r) => r.ok ? r.json() : Promise.reject()); })])
    .then((set) => set && set.format === "mechanismo-set/3" ? set : Promise.reject())
    .then((set) => { try { start(set); } catch (e) { start(builtIn()); } }, () => start(builtIn()));
})();
</script>
