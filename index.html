<!DOCTYPE html>

<title>Mechanismo</title>
<style>
:root { color-scheme: dark; --ink: #e6e8ea; --muted: #a3adb5; --bg: #000; }
body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }

video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #000; }

</style>
</head>
<body>
<main>
<h1>Mechanismo</h1>
<video src="mechanismo.mp4" poster="mechanismo.jpg" autoplay muted loop playsinline preload="auto"

<p id="how">Designed by code, not prompted. Each mechanism is worked out from a written brief and checked. Same brief, same design.</p>
<p id="more"><a href="https://run.mechanismo.ai/">See our mechanisms run, each one checked: run.mechanismo.ai</a></p>
</main>
